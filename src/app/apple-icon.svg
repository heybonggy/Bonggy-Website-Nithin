<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="p" cx="36%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#7ef0c0" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#053826" />
    </radialGradient>
  </defs>

  <!-- Back arc of the ring -->
  <path
    d="M 224 86 A 110 36 -22 0 0 32 170"
    fill="none"
    stroke="#5eead4"
    stroke-width="10"
    stroke-linecap="round"
  />

  <!-- Planet -->
  <circle cx="128" cy="128" r="82" fill="url(#p)" />

  <!-- Glossy highlight -->
  <ellipse
    cx="104"
    cy="94"
    rx="24"
    ry="10"
    fill="white"
    opacity="0.4"
    transform="rotate(-18 104 94)"
  />

  <!-- Front arc of the ring -->
  <path
    d="M 224 86 A 110 36 -22 0 1 32 170"
    fill="none"
    stroke="#5eead4"
    stroke-width="10"
    stroke-linecap="round"
  />
</svg>
